services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:8080"
    environment:
      MESHCORE_HOST: ${MESHCORE_HOST:-192.168.88.14}
      MESHCORE_PORT: ${MESHCORE_PORT:-5000}
      MESHCORE_AUTOCONNECT: "1"
      MESHCORE_DB: /app/data/messages.sqlite3
    volumes:
      - meshcore-data:/app/data
volumes:
  meshcore-data:
